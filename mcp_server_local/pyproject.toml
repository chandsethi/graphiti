[project]
name = "graphiti-local"
version = "0.1.0"
description = "Local-only knowledge graph for Codex (no API keys required)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Graphiti Local Contributors"}
]

dependencies = [
    "pydantic>=2.11.5",
    "python-dotenv>=1.0.1",
    "kuzu>=0.11.3,<0.12",
    "pandas>=2.0.0,<4.0",
    "mcp>=1.1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.1",
]

[project.scripts]
graphiti-local-mcp = "graphiti_local.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
